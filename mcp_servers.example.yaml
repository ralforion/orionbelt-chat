# Additional MCP servers for OrionBelt Chat.
#
# Copy to `mcp_servers.yaml` — the app looks for that name in the directory you
# launch from, then in the Chainlit app root (~/.orionbelt-chat by default).
# Point MCP_SERVERS_FILE at any other path to override.
#
# These are ADDED to the two servers configured by ANALYTICS_SERVER_DIR and
# SEMANTIC_LAYER_SERVER_DIR, so adding one server means one entry here. Reusing
# a built-in name ("OrionBelt Analytics", "OrionBelt Semantic Layer") replaces
# that server instead. To switch one off, unset its environment variable —
# there is no `enabled:` field, and every entry needs a working endpoint.
#
# Each entry needs exactly one of:
#   endpoint: https://…      a remote server over Streamable HTTP
#                            optional: headers for API-key/Bearer auth
#   endpoint: <dir> + module a Python project, run as
#                            `uv run --directory <endpoint> python -m <module>`
#   command: + args:         anything else, over stdio
#
# `${VAR}` in an endpoint, headers, command, args or env value is replaced by
# that environment variable — or by the matching line in a `.env`, looked for
# beside this file, in the app root, and in the directory you launch from.
# Name your API keys that way and they stay out of this file (and out of git).
# The spelling must be exactly ${NAME}: an unset variable, or a near miss such
# as ${MY-KEY} or ${KEY:-default}, is reported in the servers panel rather than
# sent on to the server as literal text.
#
# Credentials go where the transport can carry them — `headers:` on an HTTP
# endpoint, `env:` on a subprocess. The wrong one for the transport is refused
# rather than ignored, so a server never reports itself connected without the
# key you meant to give it.

servers:
  # ══ Demos: remote, no install, no API key ═══════════════════════
  # Copy this file as-is and these three are live on the next restart.

  # Ask questions about any public GitHub repository — "how does
  # pydantic-ai handle MCP sampling?" — answered from the indexed source.
  - name: DeepWiki
    endpoint: https://mcp.deepwiki.com/mcp

  # Current, version-specific documentation for thousands of libraries,
  # fetched from the official sources rather than recalled by the model.
  - name: Context7
    endpoint: https://mcp.context7.com/mcp

  # Public development indicators, metadata and time series from the
  # World Bank Data360 platform.
  - name: World Bank Data360
    endpoint: https://maimcpext.worldbank.org/ext/data360/mcp

  # ══ Demos: web search (free API key) ════════════════════════════

  # Tavily — search, extract, crawl. Remote, so nothing to install.
  # Key: https://app.tavily.com  →  put TAVILY_API_KEY in your .env
  # - name: Tavily
  #   endpoint: https://mcp.tavily.com/mcp/
  #   headers:
  #     Authorization: Bearer ${TAVILY_API_KEY}

  # Brave Search — web, news, image and local search, run locally via npx.
  # Key: https://brave.com/search/api/  →  BRAVE_API_KEY in your .env
  # - name: Brave Search
  #   command: npx
  #   args: ["-y", "@brave/brave-search-mcp-server"]
  #   env:
  #     BRAVE_API_KEY: ${BRAVE_API_KEY}

  # ══ Demos: public data (free API key) ═══════════════════════════

  # Data Commons — Google's public statistical knowledge graph.
  # Key: https://apikeys.datacommons.org  →  DATACOMMONS_API_KEY in your .env
  # - name: Data Commons
  #   endpoint: https://api.datacommons.org/mcp
  #   headers:
  #     X-API-Key: ${DATACOMMONS_API_KEY}

  # ══ Demos: local, over stdio (needs uvx or npx on PATH) ═════════
  # The first launch downloads the server, which can outrun the connection
  # timeout; it connects normally on the next restart.

  # Fetch a URL and hand the agent the page as markdown.
  # - name: Fetch
  #   command: uvx
  #   args: ["mcp-server-fetch"]

  # Read and write files under the directories you list — and nothing else.
  # - name: Filesystem
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
  #   env:
  #     LOG_LEVEL: info

  # ══ Your own servers ════════════════════════════════════════════

  # A local Python project, launched the way the OrionBelt servers are:
  # `endpoint` is the project directory, `module` the module to run inside it.
  # - name: My Analytics
  #   endpoint: ../my-analytics
  #   module: my_analytics

  # Opt in before a server may issue MCP sampling/createMessage calls back to
  # the client's LLM. Off unless declared: MCP does not advertise the need from
  # the server side, and a third-party server should not reach your model
  # budget by default. MCP_ALLOW_SAMPLING=false disables it globally regardless.
  # - name: My Agentic Server
  #   endpoint: https://agents.example.com/mcp
  #   sampling: true
