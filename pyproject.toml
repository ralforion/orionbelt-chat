[project]
name = "orionbelt-chat"
version = "1.6.2"
description = "OrionBelt Chat - Chainlit + Pydantic AI chat client for OrionBelt Analytics"
authors = [{name = "Ralf Becher, RALFORION d.o.o.", email = "info@ralforion.com"}]
readme = "README.md"
requires-python = ">=3.11,<3.14"
# PEP 639. BUSL-1.1 is the SPDX identifier for the Business Source License 1.1
# — not BSL-1.1, which SPDX does not define, and not BSL-1.0, which is the
# Boost Software License and an entirely different set of terms.
license = "BUSL-1.1"
license-files = ["LICENSE"]
keywords = ["chainlit", "pydantic-ai", "mcp", "chat", "analytics", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "chainlit>=2.0.0",
    "pydantic-ai>=2.10.0",
    "pydantic-ai-slim[openai,anthropic]>=2.10.0",
    "pydantic-settings>=2.0.0",
    # Imported directly for `get_default_environment()`, which decides what a
    # stdio MCP subprocess inherits; it arrives via pydantic-ai either way, but
    # a direct import deserves a direct pin.
    "mcp>=1.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
# Seeds a writable Chainlit app root and runs the packaged app; see cli.py.
orionbelt-chat = "orionbelt_chat.cli:main"

[project.urls]
Homepage = "https://github.com/ralforion/orionbelt-chat"
Repository = "https://github.com/ralforion/orionbelt-chat"
Issues = "https://github.com/ralforion/orionbelt-chat/issues"
Changelog = "https://github.com/ralforion/orionbelt-chat/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A real distribution name, not "src": a wheel that installs a top-level `src`
# module squats that import name for every environment it lands in.
packages = ["orionbelt_chat"]

[tool.hatch.build.targets.sdist]
# The wheel's contents plus what is needed to rebuild and verify it.
include = [
    "/orionbelt_chat",
    "/tests",
    "/scripts",
    "/licenses",
    "/README.md",
    "/mcp_servers.example.yaml",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line too long (Chainlit messages can be long)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
