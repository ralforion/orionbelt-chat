version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dev:
        dependency-type: "development"
      python-prod:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # `groups` covers version updates only unless a group says otherwise, so
      # without this one a batch of advisories arrives as one PR per package —
      # four separate rewrites of the same lockfile, each conflicting with the
      # next. That is what enabling security updates produced before v1.6.2.
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
    # The image's Python is not a free-floating base: it has to sit inside
    # requires-python (<3.14) and the CI test matrix, and 3.14+ breaks Chainlit's
    # static-file serving (anyio.NoEventLoopError -- see the matrix note in
    # ci.yml). THIRD_PARTY_NOTICES.md also names the interpreter's licence path.
    # A minor or major bump therefore moves pyproject, ci.yml, the Dockerfile and
    # the notice together, deliberately -- a tag-only PR here is always wrong and
    # passes CI anyway, since CI never builds the image.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
