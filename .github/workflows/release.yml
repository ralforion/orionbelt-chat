name: Release

# Create a GitHub Release when a version tag is pushed. The Docker image is
# built separately by docker-publish.yml (also on v* tags); this workflow owns
# the GitHub Release object, which tagging alone does NOT create.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Everything that runs repository code, third-party tooling and the resolved
  # dependency tree happens here, with a token that cannot write. The release
  # assets leave as artifacts.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, before any other action runs. Ordering is the point: an action
      # that has already executed could have rewritten the workspace, this
      # script included, so a verifier placed after it would be checking
      # whatever that action left behind. Only checkout runs first, and it has
      # to, since nothing can be verified before the tree it fetches exists.
      # It covers publish's actions too, which is why that job needs no copy:
      # publish cannot start until this job has passed.
      - name: Verify every Action is pinned to its named release
        run: ./scripts/check-action-pins.sh

      # Enforce the version-bump rule (CLAUDE.md) at the point it actually
      # ships. A tag whose code disagrees with itself must not become a
      # release. uv.lock is the fourth place, but it is already guarded by
      # CI's `uv sync --frozen`, so it is not re-checked here.
      - name: Verify version consistency
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)"/\1/')
          header=$(grep -m1 'var VERSION' orionbelt_chat/public/header.js | sed -E 's/.*"v([^"]+)".*/\1/')
          badge=$(grep -m1 'badge/version-' README.md | sed -E 's#.*badge/version-([0-9][0-9.]*)-.*#\1#')
          echo "tag=$tag pyproject=$pyproject header=$header badge=$badge"
          rc=0
          [ "$pyproject" = "$tag" ] || { echo "::error file=pyproject.toml::version is '$pyproject', expected '$tag'"; rc=1; }
          [ "$header"    = "$tag" ] || { echo "::error file=orionbelt_chat/public/header.js::VERSION is '$header', expected '$tag'"; rc=1; }
          [ "$badge"     = "$tag" ] || { echo "::error file=README.md::version badge is '$badge', expected '$tag'"; rc=1; }
          exit $rc

      # Compliance artifacts for the release. The container image carries its
      # own copy of the attribution file (see the Dockerfile), but anyone
      # running from source gets it here instead of having to build the image.
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          # Must match the Dockerfile's base image: the resolved set is
          # interpreter-dependent -- 3.11 pulls in backports-tarfile,
          # importlib-metadata and zipp, which 3.13 does not, a difference of
          # three packages in the current lock -- and the SBOM is meant to
          # describe the image. This governs `.venv` and the SBOM only; the
          # notice check below deliberately resolves its own environment on
          # 3.11, for the opposite reason. See the note there.
          python-version: "3.13"

      - name: Resolve the runtime environment
        run: uv sync --frozen --no-dev

      # Verified, not regenerated. The notice attached to a release must be the
      # file the repository was reviewed with, so a tag pushed past a bypassed CI
      # run fails here instead of publishing a notice nobody read.
      #
      # Its own environment, resolved for 3.11, rather than the 3.13 `.venv`
      # above. The two are answering different questions and the interpreter
      # follows from that: the SBOM describes the shipped image, so it wants the
      # image's 3.13, while the notice credits the union of every interpreter
      # requires-python supports, and only the floor installs all of it --
      # backports-tarfile, importlib-metadata and zipp carry
      # `python_full_version < 3.12` markers, so on 3.13 they are absent and the
      # gate cannot read the licences of packages the notice lists. This must
      # stay in step with the `licences` job in ci.yml, which is what generated
      # the committed file; if they disagree on the interpreter, every release
      # fails here. UV_PROJECT_ENVIRONMENT keeps it out of `.venv`, which the
      # SBOM step still needs on 3.13.
      #
      # packaging is installed with `uv pip`, not `python -m pip`: the venv uv
      # builds has no pip in it, and it cannot come from the dev extra either,
      # since this environment is deliberately --no-dev.
      - name: THIRD_PARTY_NOTICES.md is current
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/notice-venv
        run: |
          uv sync --frozen --no-dev --python 3.11
          uv pip install --python "$RUNNER_TEMP/notice-venv/bin/python" -q packaging
          "$RUNNER_TEMP/notice-venv/bin/python" scripts/third_party_notices.py --check

      # CycloneDX rather than the image attestation, so the SBOM is fetchable
      # without a registry client. --output-reproducible keeps it diffable
      # between releases.
      #
      # The generator is pinned like an Action, and goes stale like one: nothing
      # bumps this automatically, because Dependabot reads manifests and this is
      # a string in a run block. Move both values deliberately.
      #
      # The version alone would not be enough. cyclonedx-python-lib composes the
      # document and would still float, and BOTH versions are recorded in the
      # SBOM's own metadata.tools — so a float shows up as an unexplained diff
      # between two releases of identical code. --exclude-newer pins the whole
      # resolution. Verified against uv 0.11.28: with and without the flag the
      # output is byte-identical today, so this is behaviour-neutral now and
      # only stops the drift later. Resolves to cyclonedx-py 7.3.1 and
      # cyclonedx-python-lib 11.12.0, spec 1.6.
      - name: Generate SBOM (CycloneDX)
        run: |
          uvx --from 'cyclonedx-bom==7.3.1' \
            --exclude-newer 2026-08-30T00:00:00Z \
            cyclonedx-py environment \
            --of JSON \
            --sv 1.6 \
            --output-reproducible \
            --pyproject pyproject.toml \
            -o sbom.cdx.json \
            .venv/bin/python

      - name: Upload the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            THIRD_PARTY_NOTICES.md
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  # The only job that can write to the repository, and the only one that needs
  # to. It runs no repository code and checks out nothing: the two files it
  # uploads were produced by `build` under a read-only token, and `gh` reaches
  # the repository through GH_REPO rather than a clone. --generate-notes is
  # server-side, so no history is needed here either.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Create GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — refreshing its assets."
            gh release upload "$GITHUB_REF_NAME" \
              THIRD_PARTY_NOTICES.md sbom.cdx.json --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --latest \
            THIRD_PARTY_NOTICES.md sbom.cdx.json
