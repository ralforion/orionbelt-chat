name: Publish to PyPI

# Publishes the package to PyPI on every version tag (v*.*.*), using PyPI
# Trusted Publishing (OIDC) — no API token is stored. workflow_dispatch is
# also enabled so an existing tag can be backfilled (run against that tag's ref).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    # Only run for version tags or a manual dispatch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/project/orionbelt-chat/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      # The app cannot start without its packaged UI assets, and a version can
      # never be re-uploaded once published — so assert they are in the wheel
      # while that is still fixable.
      - name: Verify wheel ships the packaged assets
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "orionbelt_chat/app.py",
              "orionbelt_chat/cli.py",
              "orionbelt_chat/system_prompt.md",
              "orionbelt_chat/chainlit.md",
              "orionbelt_chat/chainlit_config.toml",
              "orionbelt_chat/public/header.js",
              "orionbelt_chat/public/header.css",
              "orionbelt_chat/public/favicon.png",
          }
          missing = sorted(required - names)
          for name in missing:
              print(f"::error::{wheel} is missing {name}")
          sys.exit(1 if missing else 0)
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
