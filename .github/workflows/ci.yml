name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # A pinned SHA is unreadable, so no human reviewer will notice one that stops
  # matching the version comment beside it. This catches a pull request that
  # swaps in a commit from a fork while leaving the comment untouched, which is
  # otherwise indistinguishable from a routine Dependabot bump.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every Action is pinned to its named release
        run: ./scripts/check-action-pins.sh

  # Style is version-independent — running it once keeps the matrix to signal.
  #
  # `needs: pins` so a forged Action never executes here while the check that
  # would catch it is still deciding. Blocking the merge is not enough: the
  # action runs during the job, and a job that has already run has already done
  # whatever it was going to do.
  #
  # This only works because `pins` is a required status check on main. A job
  # whose `needs:` failed reports as *skipped*, and branch protection counts a
  # skipped required check as satisfied — so `needs: pins` without `pins` being
  # required is worse than no gate at all: a failing pin check would skip lint
  # and test straight into a green merge. The required contexts are
  # `pins`, `lint`, `test (py3.11)`, `test (py3.12)` and `test (py3.13)`.
  lint:
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Whole tree, not just the package and tests — scripts/ ships too.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

  # Its own job rather than a step inside `lint`, for two reasons. The gate must
  # run against the environment the image ships -- --no-dev, resolved for 3.13 --
  # which is not the lint venv; and an open licence question should fail on its
  # own line rather than turning the linter red, where it reads as a code problem
  # and blocks a merge that has nothing to do with it.
  #
  # It also cannot be reproduced from a developer's laptop: jeepney and
  # SecretStorage resolve on Linux and not on macOS, and the notice describes a
  # Linux image. See RELEASING.md for the container one-liner.
  #
  # Resolved on 3.11, the floor in requires-python, rather than the 3.13 the
  # image ships. The notice credits the union of every interpreter this project
  # supports, and only the floor installs all of it -- backports-tarfile,
  # importlib-metadata and zipp carry `python_full_version < 3.12` markers, so on
  # 3.13 they are absent and the gate cannot read the licences of packages the
  # notice lists. Over-crediting is the safe direction here: the 3.13 image
  # contains a subset of what is credited, never more.
  licences:
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Resolve the shipping environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/shipping-venv
        run: uv sync --frozen --no-dev --python 3.11

      # --check fails on a stale committed notice *and* on any dependency whose
      # licence is neither permissive nor written up in ACKNOWLEDGED. A package
      # shipping no licence text stops here too, naming the override to add.
      #
      # packaging is installed with `uv pip`, not `python -m pip`: the venv uv
      # builds has no pip in it. It cannot come from the dev extra either, since
      # this environment is deliberately --no-dev.
      - name: Attribution is complete and up to date
        run: |
          uv pip install --python "$RUNNER_TEMP/shipping-venv/bin/python" -q packaging
          "$RUNNER_TEMP/shipping-venv/bin/python" scripts/third_party_notices.py --check

  # Gated on `pins` for the same reason as `lint`, and required for the same
  # reason — see the note there before removing either half.
  test:
    name: test (py${{ matrix.python-version }})
    needs: pins
    runs-on: ubuntu-latest
    strategy:
      # One version failing shouldn't mask the others' results.
      fail-fast: false
      matrix:
        # The full range pyproject's requires-python declares. 3.14 is excluded
        # deliberately: Chainlit's static-file serving raises
        # anyio.NoEventLoopError there, so the app cannot serve its UI.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Type check (mypy)
        run: uv run mypy orionbelt_chat/

      - name: Test (pytest)
        run: uv run pytest

      # pytest never starts the server, so a runtime-only failure to serve the
      # UI passes every other check. Boot the app and fetch a static asset:
      # "/" returns the shell even when assets 500, so probe an asset, not "/".
      - name: Smoke (serve and fetch a static asset)
        env:
          OPENROUTER_API_KEY: sk-smoke-test-not-a-real-key
        run: |
          uv run orionbelt-chat --port 8765 --headless &
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/ || true)" = "200" ] && break
            sleep 2
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/public/header.js || true)
          echo "GET /public/header.js -> $status"
          test "$status" = "200"
