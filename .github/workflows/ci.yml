name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # A pinned SHA is unreadable, so no human reviewer will notice one that stops
  # matching the version comment beside it. This catches a pull request that
  # swaps in a commit from a fork while leaving the comment untouched, which is
  # otherwise indistinguishable from a routine Dependabot bump.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every Action is pinned to its named release
        run: ./scripts/check-action-pins.sh

  # Style is version-independent — running it once keeps the matrix to signal.
  #
  # `needs: pins` so a forged Action never executes here while the check that
  # would catch it is still deciding. Blocking the merge is not enough: the
  # action runs during the job, and a job that has already run has already done
  # whatever it was going to do.
  #
  # This only works because `pins` is a required status check on main. A job
  # whose `needs:` failed reports as *skipped*, and branch protection counts a
  # skipped required check as satisfied — so `needs: pins` without `pins` being
  # required is worse than no gate at all: a failing pin check would skip lint
  # and test straight into a green merge. The required contexts are
  # `pins`, `lint`, `test (py3.11)`, `test (py3.12)` and `test (py3.13)`.
  lint:
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Whole tree, not just the package and tests — scripts/ ships too.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # The image generates this at build time (see the Dockerfile) and the
      # release attaches it. Running it here means a break surfaces on the PR
      # that caused it, not during a tagged release build.
      #
      # Deliberately its own --no-dev 3.13 environment rather than the lint
      # venv above: the gate must see exactly what the image redistributes.
      # Dev-only packages are not redistributed and must not be able to fail
      # it, and the resolved set differs by interpreter.
      - name: Resolve the shipping environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/shipping-venv
        run: uv sync --frozen --no-dev --python 3.13

      # --fail-on-missing-notice is the point of this step: a new dependency
      # that ships no license text stops here, with the licenses/ file to add
      # named in the error. Output is discarded; only the exit code matters.
      - name: Attribution covers every shipped package
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)"/\1/')
          python3 scripts/gen_third_party_licenses.py \
            --venv "$RUNNER_TEMP/shipping-venv" \
            --version "$version" \
            --overrides licenses \
            --fail-on-missing-notice \
            -o "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"

      # The committed copy is what a reader sees, and nothing regenerates it on
      # their behalf: a dependency added, removed or bumped in uv.lock changes
      # the attribution and leaves the file behind. The generator is
      # deterministic for a given environment, so the check is a plain diff —
      # against the file the step above just produced from the locked set, at
      # the version pyproject declares.
      - name: Committed attribution is up to date
        run: |
          if ! diff -u THIRD_PARTY_LICENSES.md "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"; then
            echo
            echo "THIRD_PARTY_LICENSES.md is stale — regenerate it ON LINUX."
            echo "The resolved set is platform-dependent (jeepney and"
            echo "SecretStorage install on Linux and not on macOS), and the"
            echo "image this describes is Linux. See RELEASING.md for the"
            echo "container one-liner if you are not on Linux."
            exit 1
          fi

  # Gated on `pins` for the same reason as `lint`, and required for the same
  # reason — see the note there before removing either half.
  test:
    name: test (py${{ matrix.python-version }})
    needs: pins
    runs-on: ubuntu-latest
    strategy:
      # One version failing shouldn't mask the others' results.
      fail-fast: false
      matrix:
        # The full range pyproject's requires-python declares. 3.14 is excluded
        # deliberately: Chainlit's static-file serving raises
        # anyio.NoEventLoopError there, so the app cannot serve its UI.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Type check (mypy)
        run: uv run mypy orionbelt_chat/

      - name: Test (pytest)
        run: uv run pytest

      # pytest never starts the server, so a runtime-only failure to serve the
      # UI passes every other check. Boot the app and fetch a static asset:
      # "/" returns the shell even when assets 500, so probe an asset, not "/".
      - name: Smoke (serve and fetch a static asset)
        env:
          OPENROUTER_API_KEY: sk-smoke-test-not-a-real-key
        run: |
          uv run orionbelt-chat --port 8765 --headless &
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/ || true)" = "200" ] && break
            sleep 2
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/public/header.js || true)
          echo "GET /public/header.js -> $status"
          test "$status" = "200"
